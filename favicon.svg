<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="padelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffff52" />
      <stop offset="100%" stop-color="#c6ff00" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0d131f" stroke="url(#padelGrad)" stroke-width="12" />
  
  <!-- Padel Racket Head -->
  <ellipse cx="230" cy="210" rx="130" ry="150" fill="#141d2e" stroke="url(#padelGrad)" stroke-width="14" filter="url(#neonGlow)"/>
  
  <!-- Perforations in Padel Racket -->
  <g fill="#00e676" opacity="0.85">
    <circle cx="180" cy="160" r="8" />
    <circle cx="230" cy="160" r="8" />
    <circle cx="280" cy="160" r="8" />
    
    <circle cx="155" cy="205" r="8" />
    <circle cx="205" cy="205" r="8" />
    <circle cx="255" cy="205" r="8" />
    <circle cx="305" cy="205" r="8" />
    
    <circle cx="180" cy="250" r="8" />
    <circle cx="230" cy="250" r="8" />
    <circle cx="280" cy="250" r="8" />
  </g>
  
  <!-- Racket Handle -->
  <rect x="220" y="340" width="22" height="120" rx="10" transform="rotate(25 220 340)" fill="#232f48" stroke="#00e676" stroke-width="4"/>
  <line x1="230" y1="365" x2="255" y2="420" stroke="#00b0ff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Electric Padel Ball -->
  <circle cx="370" cy="140" r="42" fill="url(#ballGrad)" stroke="#111" stroke-width="4" filter="url(#neonGlow)"/>
  <path d="M 345 125 Q 370 140 345 155" stroke="#fff" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 395 125 Q 370 140 395 155" stroke="#fff" stroke-width="4" fill="none" opacity="0.7"/>
</svg>